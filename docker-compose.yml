services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OFFERPILOT_OPENAI_API_KEY=${OFFERPILOT_OPENAI_API_KEY}
      - OFFERPILOT_OPENAI_BASE_URL=${OFFERPILOT_OPENAI_BASE_URL}
      - OFFERPILOT_OPENAI_MODEL=${OFFERPILOT_OPENAI_MODEL}
      - OFFERPILOT_EMBEDDING_API_KEY=${OFFERPILOT_EMBEDDING_API_KEY}
      - OFFERPILOT_EMBEDDING_BASE_URL=${OFFERPILOT_EMBEDDING_BASE_URL}
      - OFFERPILOT_EMBEDDING_MODEL=${OFFERPILOT_EMBEDDING_MODEL}
      - OFFERPILOT_EMBEDDING_TIMEOUT_SECONDS=${OFFERPILOT_EMBEDDING_TIMEOUT_SECONDS:-30}
      - OFFERPILOT_REQUIRE_EMBEDDING=${OFFERPILOT_REQUIRE_EMBEDDING:-true}
      - MIMO_API_KEY=${MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      - MIMO_ASR_MODEL=${MIMO_ASR_MODEL:-mimo-v2.5-asr}
      - OFFERPILOT_SQLITE_PATH=/app/data/offerpilot.db
      - OFFERPILOT_KNOWLEDGE_DIR=/app/knowledge
      - OFFERPILOT_ADMIN_KEY=${OFFERPILOT_ADMIN_KEY}
      - OFFERPILOT_LOG_LEVEL=${OFFERPILOT_LOG_LEVEL:-info}
    volumes:
      - sqlite-data:/app/data
      - ./knowledge:/app/knowledge:ro
      - ./harness:/app/harness:ro
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - API_BASE_URL=${API_BASE_URL:-http://api:8000}
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://api:8000}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlite-data:
